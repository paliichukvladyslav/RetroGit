{% extends "base.html" %} {% block content %}
<div class="window-grid">
    <div class="col-left">
        <div class="window" style="margin-bottom: 1.5rem">
            <div class="title-bar">
                <div class="title-bar-text">
                    <i class="ri-user-3-line"></i> Візитна картка
                </div>
            </div>
            <div
                class="window-body"
                style="
                    padding: 1.5rem;
                    display: flex;
                    align-items: center;
                    gap: 2rem;
                "
            >
                {% if has_avatar %}
                <img
                    src="/.avatars/{{ user }}"
                    alt="{{ user }}"
                    class="avatar-circle avatar-big"
                    style="margin: 0"
                />
                {% else %}
                <i
                    class="ri-user-line"
                    style="font-size: 128px; line-height: 1; color: #555"
                ></i>
                {% endif %}
                <div>
                    <h2 style="margin: 0 0 0.5rem 0; font-size: 24px">
                        {{ user }}
                    </h2>
                    <p style="margin: 0; color: #555; font-size: 14px">
                        Користувач RetroGit
                    </p>
                </div>
            </div>
        </div>

        <div class="window">
            <div class="title-bar">
                <div class="title-bar-text">
                    <i class="ri-folder-shared-line"></i> Профіль: {{ user }}
                </div>
            </div>
            <div class="window-body" style="padding: 1rem">
                <h3>Репозиторії користувача</h3>

                <ul class="file-list" id="repo-list">
                    {% for repo in repos %}
                    <li>
                        <i
                            class="ri-git-repository-line"
                            style="color: #0055ff"
                        ></i>
                        <a href="/{{ user }}/{{ repo }}"
                            ><strong>{{ repo }}</strong></a
                        >
                    </li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </div>

    <div class="col-right">
        <div class="window">
            <div class="title-bar">
                <div class="title-bar-text">Ініціалізація репозиторію</div>
            </div>
            <div class="window-body" style="padding: 1rem">
                <form
                    hx-post="/{{ user }}/create-repo"
                    hx-target="#repo-list"
                    hx-swap="beforeend"
                    hx-on::after-request="this.reset()"
                >
                    <div class="field-row-vertical">
                        <label
                            for="reponame"
                            style="margin-bottom: 0.5rem; font-weight: bold"
                            >Назва репозиторію:</label
                        >
                        <input
                            id="reponame"
                            type="text"
                            name="reponame"
                            placeholder="напр. linux"
                            required
                            style="width: 100%"
                        />
                    </div>
                    <div
                        class="field-row"
                        style="justify-content: flex-end; margin-top: 1.25rem"
                    >
                        <button type="submit">Ініціалізувати</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
