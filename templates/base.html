<!doctype html>
<html lang="uk">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>RetroGit</title>
        <link rel="stylesheet" href="https://unpkg.com/xp.css" />
        <script src="https://unpkg.com/htmx.org@2.0.0"></script>
        <link
            href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css"
            rel="stylesheet"
        />
        <style>
            body {
                background-color: #5a7edc;
                background-image:
                    linear-gradient(
                        rgba(255, 255, 255, 0.1) 1px,
                        transparent 1px
                    ),
                    linear-gradient(
                        90deg,
                        rgba(255, 255, 255, 0.1) 1px,
                        transparent 1px
                    );
                background-size: 20px 20px;
                background-attachment: fixed;

                padding: 2rem;
                margin: 0;
                font-family: sans-serif;
                font-size: 16px;
            }
            .desktop {
                max-width: 1200px;
                margin: 0 auto;
            }

            .window .title-bar-text {
                font-size: 16px;
                font-weight: bold;
            }

            .window-body h2,
            .window-body h3 {
                font-size: 18px;
                font-weight: bold;
                margin-top: 0;
                margin-bottom: 1rem;
                color: #000;
            }

            .title-bar-controls {
                display: flex;
                align-items: center;
                gap: 2px;
            }

            .window-body strong a {
                font-size: 16px;
            }
            .window-body i {
                font-size: 20px;
            }

            .window-body a {
                text-decoration: none;
                color: #000;
                font-size: 16px;
            }
            .window-body a:hover {
                text-decoration: underline;
                color: #0000ff;
            }

            .file-list {
                list-style-type: none;
                padding: 0;
                margin: 0;
            }
            .file-list li {
                padding: 0.6rem 0.75rem;
                border-bottom: 1px solid #d1d5db;
                display: flex;
                align-items: center;
                gap: 0.75rem;
                font-size: 16px;
            }
            .file-list li:last-child {
                border-bottom: none;
            }
            .file-list i {
                font-size: 22px;
            }

            .window-grid {
                display: grid;
                grid-template-columns: 2fr 1fr;
                gap: 1.5rem;
                margin-top: 1.5rem;
                align-items: flex-start;
            }

            .window-grid {
                display: flex;
                flex-wrap: wrap;
                gap: 1.5rem;
                align-items: flex-start;
            }
            /* Левая колонка (тянется сильнее) */
            .col-left {
                flex: 2 1 400px;
                display: flex;
                flex-direction: column;
                gap: 1.5rem;
            }
            /* Правая колонка (тянется слабее) */
            .col-right {
                flex: 1 1 250px;
                display: flex;
                flex-direction: column;
                gap: 1.5rem;
            }

            input[type="text"] {
                font-size: 16px !important;
                padding: 4px 6px !important;
            }
            button[type="submit"] {
                font-size: 14px !important;
                font-weight: bold !important;
            }

            menu[role="tablist"] {
                padding-left: 2px;
            }
            menu[role="tablist"] li[role="tab"] {
                margin-right: 2px;
            }
            menu[role="tablist"] li[role="tab"] a {
                display: flex;
                align-items: center;
                gap: 6px;
                padding: 2px 6px;
            }

            .markdown-body {
                font-family: "Tahoma", sans-serif;
                font-size: 15px;
                line-height: 1.5;
                color: #000000;
            }
            .markdown-body h1 {
                font-size: 24px;
                font-weight: bold;
                margin-top: 0;
                margin-bottom: 16px;
                padding-bottom: 6px;
                border-bottom: 1px solid #d1d5db;
            }
            .markdown-body h2 {
                font-size: 20px;
                margin-bottom: 12px;
            }
            .markdown-body h3 {
                font-size: 16px;
                margin-bottom: 12px;
            }
            .markdown-body p,
            .markdown-body ul,
            .markdown-body ol {
                margin-bottom: 16px;
            }
            .markdown-body a {
                color: #0000ff;
                text-decoration: underline;
            }
            .markdown-body code {
                font-family: "Courier New", Courier, monospace;
                background-color: #f0f0f0;
                padding: 2px 4px;
                border: 1px solid #cccccc;
                border-radius: 2px;
            }
            .markdown-body pre {
                background-color: #ffffff;
                border: 1px solid #7f9db9;
                padding: 12px;
                overflow-x: auto;
                margin-bottom: 16px;
            }
            .markdown-body pre code {
                background-color: transparent;
                border: none;
                padding: 0;
            }
            .markdown-body blockquote {
                margin: 0 0 16px 0;
                padding-left: 12px;
                border-left: 4px solid #7f9db9;
                color: #555555;
            }
        </style>
    </head>
    <body>
        <div class="desktop">
            <div class="window" style="margin-bottom: 2rem">
                <div class="title-bar">
                    <div class="title-bar-text">
                        <i class="ri-github-fill"></i> RetroGit v0.1.exe
                    </div>
                    <div class="title-bar-controls">
                        <button aria-label="Minimize"></button>
                        <button aria-label="Maximize"></button>
                        <button
                            aria-label="Close"
                            onclick="window.location.href = '/'"
                        ></button>
                    </div>
                </div>
                <div
                    class="window-body"
                    style="padding: 0.5rem 1rem; font-weight: bold"
                >
                    <a href="/"><i class="ri-home-4-line"></i> На головну</a>
                </div>
            </div>

            {% block content %}{% endblock %}
        </div>
    </body>
</html>
